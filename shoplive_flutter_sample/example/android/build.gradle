// shoplive_* 플러그인이 같은 exclusiveContent를 중복 선언하지 않도록 표시(플러그인 build.gradle 참고)
ext.shopliveMavenRepoConfigured = true

allprojects {
    repositories {
        google()
        mavenCentral()
        // Shoplive Android SDK 3.x 배포 저장소 — cloud.shoplive 그룹은 여기서만 받는다(Maven Central에 같은 좌표·다른 내용 artifact 존재)
        exclusiveContent {
            forRepository { maven { url "https://sdk.shoplive.cloud/maven-repo" } }
            filter { includeGroup "cloud.shoplive" }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
